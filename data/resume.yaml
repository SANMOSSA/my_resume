    Resumen:
    - Ingeniero en sistemas con sólida experiencia en desarrollo backend, 
      integración de servicios en la nube y dirección técnica de proyectos 
      móviles. Actualmente me desempeño como Development Manager en 
      PartnerHelper, liderando el desarrollo de una aplicación iOS para la 
      gestión eficiente de citas médicas mediante el uso de IA, diseñando y 
      manteniendo el backend con integraciones en Azure y Microsoft Dynamics, y 
      coordinando el desarrollo de agentes de inteligencia artificial basados en
      Large Language Models (LLMs) en Azure para empresas.
    - Poseo competencias avanzadas en Python y Flask, con enfoque en la 
      implementación de soluciones escalables, seguras y alineadas con buenas 
      prácticas de despliegue. En la mayoría de mis proyectos aplico 
      Programación Orientada a Objetos (POO), principios SOLID y el patrón 
      Modelo-Vista-Controlador (MVC), garantizando arquitecturas limpias, 
      mantenibles y fáciles de escalar.
    - He desarrollado proyectos de procesamiento de lenguaje natural, 
      transcripción de audio y generación de voz sintética, además del diseño de
      agentes conversacionales (voz, texto y chat) orientados a la adquisición y
      soporte de clientes por medio de los canales de Meta y chats webs. Estas 
      soluciones integran IA en sistemas internos corporativos, optimizando 
      procesos y mejorando la experiencia de usuario.
    - Adicionalmente, he desarrollado aplicaciones de automatización para la 
      optimización de procesos personales y organizacionales, incluyendo 
      sistemas de descargas automaticas y scripts de tareas repetitivas. Me 
      caracterizo por mis habilidades analíticas, capacidad de resolución de 
      problemas, adaptabilidad a nuevas tecnologías y compromiso con la entrega 
      de soluciones efectivas y escalables. Soy hablante nativo de español y 
      cuento con nivel intermedio de inglés.
